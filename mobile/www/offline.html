<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Before the Bell</title>
<style>html,body{margin:0;height:100%;background:#0b1730;color:#e8edf7;font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:18px 0 8px}p{color:#a9b5d1;margin:0 0 22px;font-size:15px;line-height:1.5}
button{font:inherit;font-weight:600;background:#1f4fff;color:#fff;border:0;border-radius:10px;padding:13px 22px}
.mk{width:56px;height:56px;border-radius:14px;background:#122247;display:grid;place-items:center;margin:0 auto}.mk i{width:24px;height:3px;background:#fff;box-shadow:0 -8px 0 #fff,0 8px 0 #2ed39a;display:block}</style></head>
<body><main><div><div class="mk"><i></i></div><h1>You're offline</h1><p>Before the Bell needs a connection to open the desk.<br>Check your internet and try again.</p>
